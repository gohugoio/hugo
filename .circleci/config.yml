parameters:

defaults: &defaults
  resource_class: large
  docker:
      - image: golang:1.27.3-bookworm
environment: &buildenv
      GOMODCACHE: /root/project/gomodcache
version: 2.1
jobs:
  prepare_release:
    <<: *defaults
    environment: &buildenv
        GOMODCACHE: /root/project/gomodcache
    steps:
      - checkout:
          path: hugo
      - &git-config
        run:
           command: |
            git config --global user.email "bjorn.erik.pedersen+hugoreleaser@gmail.com"
            git config --global user.name "hugoreleaser"
      - run:
          command: |
            cd hugo
            go mod download
            go run -tags release main.go release --step 1
      - save_cache:
          key: git-sha-{{ .Revision }}
          paths:
            - hugo
            - gomodcache
  build:
    <<: [*defaults]
    environment:
      <<: [*buildenv]
    steps:
      - &restore-cache
        restore_cache:
          key: git-sha-{{ .Revision }}
      - &install-hugoreleaser
        run:
          command: go install github.com/gohugoio/hugoreleaser@latest
      - run:
          no_output_timeout: 20m
          command: |
            mkdir -p /tmp/files/dist
            cd hugo
            hugoreleaser build -paths "builds/**" -workers 3 -dist /tmp/files/dist -chunks $CIRCLE_NODE_TOTAL -chunk-index $CIRCLE_NODE_INDEX
      - persist_to_workspace:
          root: /tmp/files
          paths:
            - dist
    parallelism: 4
  archive_and_release:
    <<: [*defaults]
    environment:
        <<: [*buildenv]
    steps:
      - *restore-cache
      - attach_workspace:
          at: /tmp/workspace
      - *git-config
      - *install-hugoreleaser
      - run:
          name: Add github.com to known hosts
          command: mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run:
          command: |
            cp -a /tmp/workspace/dist/. ./hugo/dist
      - run:
          command: |
            cd hugo
            hugoreleaser archive
            hugoreleaser release
            go run -tags release main.go release --step 2
workflows:
  version: 2
  release:
      jobs:
        - prepare_release:
            filters:
              branches:
                only: /release-.*/
        - build:
            requires:
            - prepare_release
        - archive_and_release:
            context: org-global
            requires:
            - build
